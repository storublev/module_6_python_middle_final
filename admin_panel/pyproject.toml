[tool.ruff]
line-length = 120
target-version = "py312"
# Миграции Django генерируются автоматически и стиль проекта не соблюдают.
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N", "S", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# В тестах assert — основной инструмент, а пароли и ключи — заглушки.
"tests/**" = ["S101", "S105", "S106"]

[tool.ruff.lint.isort]
known-first-party = ["config", "movies", "tests", "users"]
