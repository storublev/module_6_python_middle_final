[flake8]
max-line-length = 120
exclude = .venv,__pycache__,auth,admin_panel
# Докстринги (pep257) обязательны для тестов: по ним видно, что проверяется.
# В коде сервиса документируются модули и классы с неочевидным поведением.
# D403 — докстринг нередко начинается с имени класса (TypeAdapter, ETL).
extend-ignore = D100,D101,D102,D103,D104,D105,D106,D107,D205,D400,D403
