# Переменные из .env попадают во все контейнеры. Для отсутствующих в нём
# переменных действуют значения по умолчанию из environment (${VAR:-default}),
# которые перекрывают env_file. Без значений по умолчанию только секреты
# сервиса авторизации: compose не запустится, пока они не заданы в .env.
x-env-file: &env-file
  - path: .env
    required: false

# Настройки сервиса авторизации: у него своя база и свой Redis.
x-auth-env: &auth-env
  AUTH_POSTGRES_HOST: auth-postgres
  AUTH_POSTGRES_PORT: 5432
  AUTH_POSTGRES_DB: ${AUTH_POSTGRES_DB:-auth}
  AUTH_POSTGRES_USER: ${AUTH_POSTGRES_USER:-auth}
  AUTH_POSTGRES_PASSWORD: ${AUTH_POSTGRES_PASSWORD:?задайте AUTH_POSTGRES_PASSWORD в .env}
  AUTH_REDIS_HOST: auth-redis
  AUTH_REDIS_PORT: 6379
  AUTH_JWT_SECRET_KEY: ${AUTH_JWT_SECRET_KEY:?задайте AUTH_JWT_SECRET_KEY в .env}
  AUTH_LOG_LEVEL: ${AUTH_LOG_LEVEL:-INFO}

services:
  postgres:
    image: postgres:13
    env_file: *env-file
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-movies_database}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123qwe}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Дамп и ETL живут в своём репозитории, здесь на них только ссылка.
      - ${ETL_PROJECT_PATH:-../new_admin_panel_sprint_3}/etl/dump.sql:/docker-entrypoint-initdb.d/dump.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 2s
      retries: 30
    restart: unless-stopped

  etl:
    build: ${ETL_PROJECT_PATH:-../new_admin_panel_sprint_3}/etl
    env_file: *env-file
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-movies_database}
      DB_USER: ${POSTGRES_USER:-app}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-123qwe}
      ELASTIC_HOST: http://elasticsearch:9200
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped

  elasticsearch:
    image: elasticsearch:8.5.3
    env_file: *env-file
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: ${ES_JAVA_OPTS:--Xms512m -Xmx512m}
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    env_file: *env-file
    # Redis здесь только кеш: персистентность не нужна, при нехватке памяти
    # вытесняются давно не использованные ключи.
    command: redis-server --maxmemory ${REDIS_MAXMEMORY:-256mb} --maxmemory-policy allkeys-lru --save "" --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  api:
    build: .
    env_file: *env-file
    environment:
      PROJECT_NAME: ${PROJECT_NAME:-movies}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Адреса зависят от сети compose, поэтому заданы здесь, а не в .env.
      ELASTIC_HOST: elasticsearch
      ELASTIC_PORT: 9200
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_EXPIRE_IN_SECONDS: ${CACHE_EXPIRE_IN_SECONDS:-300}
      WEB_CONCURRENCY: ${API_WORKERS:-2}
    expose:
      - 8000
    depends_on:
      elasticsearch:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Сервис авторизации хранит персональные данные, поэтому его база отделена
  # от базы фильмов и наружу не открыта.
  auth-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${AUTH_POSTGRES_DB:-auth}
      POSTGRES_USER: ${AUTH_POSTGRES_USER:-auth}
      POSTGRES_PASSWORD: ${AUTH_POSTGRES_PASSWORD:?задайте AUTH_POSTGRES_PASSWORD в .env}
    volumes:
      - auth_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 2s
      retries: 30
    restart: unless-stopped

  auth-redis:
    image: redis:7.4-alpine
    # Сессии пользователей и кеш прав. В отличие от кеша API, вытеснять ключи
    # нельзя — пропали бы сессии, а журнал AOF сохраняет их при перезапуске.
    command: redis-server --appendonly yes --appendfsync everysec --maxmemory-policy noeviction
    volumes:
      - auth_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # Одноразовый контейнер: применяет миграции и завершается. Сервис стартует
  # после него, а реплики сервиса не применяют миграции наперегонки.
  auth-migrations:
    build: ./auth
    image: movies-auth
    environment: *auth-env
    command: ["alembic", "upgrade", "head"]
    depends_on:
      auth-postgres:
        condition: service_healthy
    restart: "no"

  auth:
    build: ./auth
    image: movies-auth
    environment:
      <<: *auth-env
      WEB_CONCURRENCY: ${AUTH_WORKERS:-2}
    expose:
      - 8000
    depends_on:
      auth-migrations:
        condition: service_completed_successfully
      auth-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/auth/api/openapi.json')"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    env_file: *env-file
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    ports:
      - "${NGINX_PORT:-80}:80"
    depends_on:
      - api
      - auth
    restart: unless-stopped

volumes:
  postgres_data:
  elasticsearch_data:
  auth_postgres_data:
  auth_redis_data:
