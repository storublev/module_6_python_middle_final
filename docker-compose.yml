# Переменные из .env попадают во все контейнеры. Для отсутствующих в нём
# переменных действуют значения по умолчанию из environment (${VAR:-default}),
# которые перекрывают env_file. Без значений по умолчанию только секреты
# сервиса авторизации: compose не запустится, пока они не заданы в .env.
x-env-file: &env-file
  - path: .env
    required: false

# Настройки сервиса авторизации: у него своя база и свой Redis.
x-auth-env: &auth-env
  AUTH_POSTGRES_HOST: auth-postgres
  AUTH_POSTGRES_PORT: 5432
  AUTH_POSTGRES_DB: ${AUTH_POSTGRES_DB:-auth}
  AUTH_POSTGRES_USER: ${AUTH_POSTGRES_USER:-auth}
  AUTH_POSTGRES_PASSWORD: ${AUTH_POSTGRES_PASSWORD:?задайте AUTH_POSTGRES_PASSWORD в .env}
  AUTH_REDIS_HOST: auth-redis
  AUTH_REDIS_PORT: 6379
  AUTH_JWT_SECRET_KEY: ${AUTH_JWT_SECRET_KEY:?задайте AUTH_JWT_SECRET_KEY в .env}
  AUTH_LOG_LEVEL: ${AUTH_LOG_LEVEL:-INFO}
  # Вход через соцсети. Поставщик включается, только если заданы обе его
  # переменные; без них его эндпоинты отвечают 404, а сервис работает как прежде.
  AUTH_OAUTH_YANDEX_CLIENT_ID: ${AUTH_OAUTH_YANDEX_CLIENT_ID:-}
  AUTH_OAUTH_YANDEX_CLIENT_SECRET: ${AUTH_OAUTH_YANDEX_CLIENT_SECRET:-}
  AUTH_OAUTH_GOOGLE_CLIENT_ID: ${AUTH_OAUTH_GOOGLE_CLIENT_ID:-}
  AUTH_OAUTH_GOOGLE_CLIENT_SECRET: ${AUTH_OAUTH_GOOGLE_CLIENT_SECRET:-}
  # Адрес возврата собирается отсюда; он же прописывается у поставщика.
  AUTH_OAUTH_REDIRECT_BASE_URL: ${AUTH_OAUTH_REDIRECT_BASE_URL:-http://localhost}
  # Куда уходят спаны трассировки. Пустое значение выключает трассировку.
  AUTH_OTLP_ENDPOINT: ${OTLP_ENDPOINT:-http://jaeger:4318/v1/traces}
  AUTH_SENTRY_DSN: ${SENTRY_DSN:-}
  AUTH_SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-local}

# Настройки админки. База у неё общая с ETL и сервисом контента — это тот же
# каталог фильмов; пароли сотрудников хранит сервис авторизации.
x-admin-env: &admin-env
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?задайте DJANGO_SECRET_KEY в .env}
  DJANGO_DEBUG: ${DJANGO_DEBUG:-False}
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
  DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-http://localhost,http://127.0.0.1}
  DJANGO_LOG_LEVEL: ${DJANGO_LOG_LEVEL:-INFO}
  DJANGO_POSTGRES_HOST: postgres
  DJANGO_POSTGRES_PORT: 5432
  DJANGO_POSTGRES_DB: ${POSTGRES_DB:-movies_database}
  DJANGO_POSTGRES_USER: ${POSTGRES_USER:-app}
  DJANGO_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123qwe}
  DJANGO_AUTH_API_URL: http://auth:8000
  DJANGO_STATIC_ROOT: /opt/app/staticfiles

# Настройки сервиса сбора пользовательских действий. Ключ подписи токенов —
# тот же, что у сервиса авторизации: подпись проверяется тем же секретом,
# которым выпущена (ADR-4 в docs/architecture/README.md).
x-ugc-env: &ugc-env
  UGC_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  UGC_KAFKA_TOPIC: ${UGC_KAFKA_TOPIC:-ugc.events}
  UGC_LOG_LEVEL: ${UGC_LOG_LEVEL:-INFO}
  UGC_MAX_EVENTS_PER_REQUEST: ${UGC_MAX_EVENTS_PER_REQUEST:-200}
  AUTH_JWT_SECRET_KEY: ${AUTH_JWT_SECRET_KEY:?задайте AUTH_JWT_SECRET_KEY в .env}
  UGC_OTLP_ENDPOINT: ${OTLP_ENDPOINT:-http://jaeger:4318/v1/traces}
  UGC_SENTRY_DSN: ${SENTRY_DSN:-}
  UGC_SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-local}

# Настройки сервиса пользовательского контента: лайки, рецензии и закладки.
# Секрет подписи токенов общий с сервисом авторизации — токены выпускает он.
x-content-env: &content-env
  CONTENT_MONGO_URI: mongodb://ugc-mongo:27017/?replicaSet=rs0
  CONTENT_MONGO_DATABASE: ${CONTENT_MONGO_DATABASE:-ugc_content}
  CONTENT_LOG_LEVEL: ${CONTENT_LOG_LEVEL:-INFO}
  CONTENT_PAGE_SIZE_DEFAULT: ${CONTENT_PAGE_SIZE_DEFAULT:-20}
  CONTENT_PAGE_SIZE_MAX: ${CONTENT_PAGE_SIZE_MAX:-100}
  AUTH_JWT_SECRET_KEY: ${AUTH_JWT_SECRET_KEY:?задайте AUTH_JWT_SECRET_KEY в .env}
  CONTENT_OTLP_ENDPOINT: ${OTLP_ENDPOINT:-http://jaeger:4318/v1/traces}
  # Пустой DSN выключает отправку ошибок: локальный стек поднимается без Sentry.
  CONTENT_SENTRY_DSN: ${SENTRY_DSN:-}
  CONTENT_SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-local}

# Настройки ETL событий. Топик тот же, что у сервиса приёма: это две стороны
# одной трубы, и расходиться им нельзя.
x-ugc-etl-env: &ugc-etl-env
  UGC_ETL_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  UGC_ETL_KAFKA_TOPIC: ${UGC_KAFKA_TOPIC:-ugc.events}
  UGC_ETL_KAFKA_GROUP_ID: ${UGC_ETL_GROUP_ID:-ugc-etl}
  UGC_ETL_CLICKHOUSE_HOST: clickhouse
  UGC_ETL_CLICKHOUSE_PORT: 8123
  UGC_ETL_CLICKHOUSE_DATABASE: ${CLICKHOUSE_DB:-ugc}
  UGC_ETL_BATCH_SIZE: ${UGC_ETL_BATCH_SIZE:-10000}
  UGC_ETL_POLL_TIMEOUT: ${UGC_ETL_POLL_TIMEOUT:-5}
  UGC_ETL_BATCH_MAX_WAIT: ${UGC_ETL_BATCH_MAX_WAIT:-30}
  UGC_ETL_MEMORY_LIMIT_MB: ${UGC_ETL_MEMORY_LIMIT_MB:-512}
  UGC_ETL_SENTRY_DSN: ${SENTRY_DSN:-}
  UGC_ETL_SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-local}
  UGC_ETL_LOG_LEVEL: ${UGC_ETL_LOG_LEVEL:-INFO}

services:
  postgres:
    # Та же версия, что у базы сервиса авторизации: одна версия PostgreSQL на
    # стек. Админке нужна не ниже 14 — столько требует Django 5.2.
    image: postgres:16-alpine
    env_file: *env-file
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-movies_database}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123qwe}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Дамп и ETL живут в своём репозитории, здесь на них только ссылка.
      - ./etl/dump.sql:/docker-entrypoint-initdb.d/dump.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 2s
      retries: 30
    restart: unless-stopped

  etl:
    build: ./etl
    env_file: *env-file
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-movies_database}
      DB_USER: ${POSTGRES_USER:-app}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-123qwe}
      ELASTIC_HOST: http://elasticsearch:9200
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped

  elasticsearch:
    image: elasticsearch:8.5.3
    env_file: *env-file
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: ${ES_JAVA_OPTS:--Xms512m -Xmx512m}
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    env_file: *env-file
    # Redis здесь только кеш: персистентность не нужна, при нехватке памяти
    # вытесняются давно не использованные ключи.
    command: redis-server --maxmemory ${REDIS_MAXMEMORY:-256mb} --maxmemory-policy allkeys-lru --save "" --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  api:
    build: .
    env_file: *env-file
    environment:
      PROJECT_NAME: ${PROJECT_NAME:-movies}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Адреса зависят от сети compose, поэтому заданы здесь, а не в .env.
      ELASTIC_HOST: elasticsearch
      ELASTIC_PORT: 9200
      REDIS_HOST: redis
      REDIS_PORT: 6379
      AUTH_API_URL: http://auth:8000
      OTLP_ENDPOINT: ${OTLP_ENDPOINT:-http://jaeger:4318/v1/traces}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-local}
      CACHE_EXPIRE_IN_SECONDS: ${CACHE_EXPIRE_IN_SECONDS:-300}
      WEB_CONCURRENCY: ${API_WORKERS:-2}
    expose:
      - 8000
    depends_on:
      elasticsearch:
        condition: service_healthy
      redis:
        condition: service_healthy
      # Права на подписочные фильмы спрашиваются у сервиса авторизации. Ждать
      # его готовности удобно, но не обязательно: откажи он позже, выдача
      # деградирует до публичных фильмов, а не упадёт.
      auth:
        condition: service_healthy
    restart: unless-stopped

  # Собирает спаны всех сервисов и показывает по ним дерево запроса. Версия
  # all-in-one держит трейсы в памяти: для разработки этого хватает, а
  # отдельные agent, collector и хранилище не нужны.
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      # Веб-интерфейс: http://localhost:16686
      - "${JAEGER_UI_PORT:-16686}:16686"
    restart: unless-stopped

  # Сервис авторизации хранит персональные данные, поэтому его база отделена
  # от базы фильмов и наружу не открыта.
  auth-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${AUTH_POSTGRES_DB:-auth}
      POSTGRES_USER: ${AUTH_POSTGRES_USER:-auth}
      POSTGRES_PASSWORD: ${AUTH_POSTGRES_PASSWORD:?задайте AUTH_POSTGRES_PASSWORD в .env}
    volumes:
      - auth_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 2s
      retries: 30
    restart: unless-stopped

  auth-redis:
    image: redis:7.4-alpine
    # Сессии пользователей и кеш прав. В отличие от кеша API, вытеснять ключи
    # нельзя — пропали бы сессии, а журнал AOF сохраняет их при перезапуске.
    command: redis-server --appendonly yes --appendfsync everysec --maxmemory-policy noeviction
    volumes:
      - auth_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # Одноразовый контейнер: применяет миграции и завершается. Сервис стартует
  # после него, а реплики сервиса не применяют миграции наперегонки.
  auth-migrations:
    build: ./auth
    image: movies-auth
    environment: *auth-env
    command: ["alembic", "upgrade", "head"]
    depends_on:
      auth-postgres:
        condition: service_healthy
    restart: "no"

  auth:
    build: ./auth
    image: movies-auth
    environment:
      <<: *auth-env
      WEB_CONCURRENCY: ${AUTH_WORKERS:-2}
    expose:
      - 8000
    depends_on:
      auth-migrations:
        condition: service_completed_successfully
      auth-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/auth/api/openapi.json')"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # Одноразовый контейнер админки: заводит свои таблицы (сотрудники, сессии,
  # журнал действий) в схеме public базы фильмов и выкладывает статику в том,
  # из которого её раздаёт nginx. Каталог (схема content) создаётся дампом ETL,
  # и Django его не мигрирует.
  django-admin-migrations:
    build: ./admin_panel
    image: movies-admin
    environment: *admin-env
    command: >
      sh -c "python manage.py migrate --no-input &&
             python manage.py collectstatic --no-input --clear"
    volumes:
      - admin_static:/opt/app/staticfiles
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  django-admin:
    build: ./admin_panel
    image: movies-admin
    environment:
      <<: *admin-env
      WEB_CONCURRENCY: ${ADMIN_WORKERS:-2}
    expose:
      - 8000
    depends_on:
      django-admin-migrations:
        condition: service_completed_successfully
      auth:
        condition: service_healthy
    restart: unless-stopped

  # Брокер событий. KRaft-режим: с версии 3.3 Kafka хранит метаданные сама, и
  # отдельный ZooKeeper больше не нужен — один контейнер вместо двух.
  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      # Один узел совмещает роли брокера и контроллера: для разработки этого
      # достаточно, в продакшене контроллеров три и они отдельные.
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # Служебные топики живут на единственном узле, поэтому реплика одна.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # Потребитель, подключившийся первым, не ждёт остальных участников группы.
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Хранение событий — 7 суток: столько у ETL есть на то, чтобы починиться
      # и дочитать поток (НФТ-8).
      KAFKA_LOG_RETENTION_HOURS: 168
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-MkU3OEVBNTcwNTJENDM2Qk}
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 30
    restart: unless-stopped

  # Одноразовый контейнер: заводит топик с нужным числом партиций и завершается.
  # Автосоздание топиков оставило бы одну партицию — и весь поток событий шёл бы
  # через одного потребителя.
  kafka-init:
    image: apache/kafka:3.9.1
    command: >
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092
      --create --if-not-exists
      --topic ${UGC_KAFKA_TOPIC:-ugc.events}
      --partitions ${UGC_KAFKA_PARTITIONS:-12}
      --replication-factor 1
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"

  # Сервис сбора пользовательских действий: Flask с воркерами gevent.
  ugc:
    build: ./ugc
    image: movies-ugc
    environment:
      <<: *ugc-env
      WEB_CONCURRENCY: ${UGC_WORKERS:-2}
    expose:
      - 8000
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ugc/api/v1/health')"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # Хранилище пользовательского контента. Версия 7.0, а не 8.x: MongoDB 8.0+
  # не стартует на ядре Linux 6.19 и новее (SERVER-121912 — tcmalloc нарушает
  # ABI rseq), а у Docker Desktop ядро как раз новее.
  ugc-mongo:
    image: mongo:7.0
    # Набор реплик из одного узла. Он нужен не ради отказоустойчивости (её у
    # одного узла нет), а ради транзакций: на обычном mongod их не бывает
    # вовсе, а сервису нужно записывать оценку и её счётчик одной операцией.
    # В бою узлов должно быть три — тогда появится и отказоустойчивость.
    command: mongod --bind_ip_all --replSet rs0
    volumes:
      - ugc_mongo_data:/data/db
    healthcheck:
      # Набор инициализируется прямо в проверке здоровья: отдельный
      # одноразовый контейнер остановил бы всё окружение по
      # --abort-on-container-exit, а ждать ручной команды после каждого
      # `compose up` неудобно. Повторный вызов rs.initiate() на собранном
      # наборе безвреден — он отвечает ошибкой, которую мы игнорируем.
      test: >
        mongosh --quiet --eval '
          try { rs.status().ok } catch (error) { rs.initiate({_id: "rs0", members: [{_id: 0, host: "ugc-mongo:27017"}]}).ok }
        '
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  ugc-content:
    build: ./ugc_content
    image: movies-ugc-content
    environment:
      <<: *content-env
      WEB_CONCURRENCY: ${CONTENT_WORKERS:-2}
    expose:
      - 8000
    depends_on:
      ugc-mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/content/api/v1/health')"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # Аналитическое хранилище событий. Схему (таблицу, витрину и материализованное
  # представление) заводит сам образ: файлы из /docker-entrypoint-initdb.d он
  # выполняет при первом запуске — так же, как postgres накатывает дамп ETL.
  # Правка схемы после этого применяется вручную или пересозданием тома.
  clickhouse:
    image: clickhouse/clickhouse-server:25.3-alpine
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-ugc}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./ugc_etl/schema:/docker-entrypoint-initdb.d:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      # Именно 127.0.0.1, а не localhost: имя резолвится сначала в ::1,
      # а ClickHouse слушает только IPv4 — проверка врала бы всегда.
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  # Непрерывный перенос событий из Kafka в ClickHouse.
  ugc-etl:
    build: ./ugc_etl
    image: movies-ugc-etl
    environment: *ugc-etl-env
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      clickhouse:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    env_file: *env-file
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      # Статику админки отдаёт nginx, а не Django: так gunicorn занят только
      # страницами, а браузер получает файлы с длинным сроком хранения.
      - admin_static:/usr/share/nginx/html/static:ro
      # Журнал доступа в JSON: отсюда его забирает filebeat и везёт в ELK
      # (deploy/observability/). Том общий с тем стеком, поэтому у него
      # фиксированное имя.
      - nginx_logs:/var/log/nginx
    ports:
      - "${NGINX_PORT:-80}:80"
    depends_on:
      - api
      - auth
      - django-admin
      - ugc
      - ugc-content
    restart: unless-stopped

volumes:
  postgres_data:
  # Имя фиксировано: этот том подключает к себе и стек наблюдаемости
  # (deploy/observability/docker-compose.yml), а имена по умолчанию у разных
  # проектов compose разные.
