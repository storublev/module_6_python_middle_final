# Куда приходят логи, что с ними делать и куда складывать.
#
# Разбора строк здесь нет намеренно: и сервисы, и nginx пишут журнал сразу в
# JSON, а filebeat раскладывает его по полям. Logstash остаётся маршрутом и
# точкой, где формат можно поправить, не трогая сервисы.

input {
    beats {
        port => 5045
        host => "0.0.0.0"
    }

    # Запасной вход для контейнеров, которым проще отдать логи драйвером gelf,
    # чем писать в файл.
    gelf {
        type => "docker"
        port => 5044
    }
}

filter {
    # Имя сервиса приходит либо из самой записи (поле service кладёт
    # core/logger.py), либо из метаданных Docker. Приводим к одному полю,
    # чтобы в Kibana фильтр был один на все источники.
    if ![service] and [container][name] {
        mutate { add_field => { "service" => "%{[container][name]}" } }
    }
    if ![service] {
        mutate { add_field => { "service" => "unknown" } }
    }
    # Записи без идентификатора запроса (старт сервиса, фоновые задачи)
    # помечаем прочерком — так поле есть всегда и по нему можно фильтровать.
    if ![request_id] {
        mutate { add_field => { "request_id" => "-" } }
    }
}

output {
    # Логи nginx и сервисов — в разные индексы: у них разные поля, и в одном
    # индексе mapping собрался бы из всего подряд.
    if [source_type] == "nginx" {
        elasticsearch {
            hosts => [ "${ES_HOST}" ]
            index => "nginx-%{+YYYY.MM.dd}"
        }
    } else {
        elasticsearch {
            hosts => [ "${ES_HOST}" ]
            index => "app-%{+YYYY.MM}"
        }
    }
}
