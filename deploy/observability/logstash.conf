# Куда приходят логи, что с ними делать и куда складывать.
#
# ЗАГОТОВКА девятого спринта (эпик E5): входы объявлены, разбор сообщений и
# разведение по индексам появятся, когда сервисы начнут слать логи.

input {
    # Драйвер gelf у контейнера: Docker сам отправляет сюда stdout сервиса.
    gelf {
        type => "docker"
        port => 5044
    }

    # Filebeat: читает файлы (JSON-лог nginx) и доставляет их сюда.
    beats {
        port => 5045
        host => "0.0.0.0"
        codec => "json"
    }
}

filter {
    # Разбирать строки grok'ом не нужно: сервисы пишут журнал сразу в JSON.
    # TODO(E5): привести имена полей к одному виду (request_id, level, service),
    # чтобы поиск по логам работал одинаково для всех сервисов.
}

output {
    stdout {
        codec => rubydebug
    }

    # Логи разных источников — в разные индексы: у nginx и у сервисов разные
    # поля, и в одном индексе mapping получился бы из всего подряд.
    if "nginx" in [tags] or "nginx" in [tag] {
        elasticsearch {
            hosts => [ "${ES_HOST}" ]
            index => "nginx-%{+YYYY.MM.dd}"
        }
    } else {
        elasticsearch {
            hosts => [ "${ES_HOST}" ]
            index => "app-%{+YYYY.MM}"
        }
    }
}
