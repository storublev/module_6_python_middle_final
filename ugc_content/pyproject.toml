[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N", "S", "ASYNC"]
# UP046 и UP047 предлагают дженерики в синтаксисе PEP 695 (`class Page[T]`,
# `def f[T]()`). Сервис написан под 3.12, но CI проверяет код и на 3.10 с 3.11,
# где такого синтаксиса ещё нет, поэтому дженерики объявляются через TypeVar.
ignore = ["UP046", "UP047"]

[tool.ruff.lint.per-file-ignores]
# В тестах assert — основной инструмент, а ключи и токены — заглушки.
"tests/**" = ["S101", "S105", "S106", "S107"]

[tool.ruff.lint.isort]
# Модули сервиса импортируются от src, как при запуске.
known-first-party = ["api", "core", "main", "models", "services", "storage", "tests"]
