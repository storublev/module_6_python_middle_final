# Окружение исследования: MongoDB и PostgreSQL в одинаковых условиях.
#
#   docker compose -f ugc_content/research/docker-compose.yml up -d
#
# Оба — одиночные узлы с одинаковыми ограничениями по процессорам и памяти.
# Иначе сравнивались бы не хранилища, а щедрость настроек: кластер MongoDB
# против одного PostgreSQL показал бы разницу в железе, а не в движке.
#
# Кластер MongoDB поднимается отдельно (docker-compose.cluster.yml) — им
# проверяется шардирование, а не скорость.
name: ugc-content-research

x-limits: &limits
  deploy:
    resources:
      limits:
        cpus: '2'
        memory: 4g

services:
  # Версия 7.0, а не 8.x: MongoDB 8.0+ не стартует на ядре Linux 6.19 и новее
  # (SERVER-121912 — tcmalloc нарушает ABI rseq, процесс падает при запуске, и
  # начиная с некоторых сборок mongod просто отказывается стартовать). У Docker
  # Desktop на этой машине ядро 7.0.12-linuxkit, поэтому 8.x здесь не работает.
  mongo:
    <<: *limits
    image: mongo:7.0
    container_name: research-mongo
    restart: unless-stopped
    command: mongod --bind_ip_all --wiredTigerCacheSizeGB 1
    ports:
      - "${RESEARCH_MONGO_PORT:-27018}:27017"
    volumes:
      - research_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 30

  postgres:
    <<: *limits
    image: postgres:16-alpine
    container_name: research-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: research
      POSTGRES_USER: ${RESEARCH_POSTGRES_USER:-research}
      POSTGRES_PASSWORD: ${RESEARCH_POSTGRES_PASSWORD:-research}
    # shared_buffers 1 ГБ — столько же, сколько кеш WiredTiger у MongoDB:
    # у обоих хранилищ должно быть поровну памяти под горячие данные.
    command: >
      postgres -c shared_buffers=1GB -c work_mem=32MB -c maintenance_work_mem=512MB
               -c max_wal_size=4GB -c checkpoint_timeout=15min -c random_page_cost=1.1
    ports:
      - "${RESEARCH_POSTGRES_PORT:-5434}:5432"
    volumes:
      - research_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${RESEARCH_POSTGRES_USER:-research} -d research"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  research_mongo_data:
  research_postgres_data:
