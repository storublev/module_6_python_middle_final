# Непрерывная интеграция: линтеры, проверка типов, тесты и уведомление.
#
# Репозиторий — несколько сервисов, у каждого своя конфигурация линтеров и
# свои зависимости, поэтому почти все задачи идут матрицей по частям
# репозитория: так видно, какой именно сервис сломался, и упавший сервис не
# прячет за собой остальные (fail-fast выключен).

name: CI

on:
  # Только pull request в мастер-ветку: этого требует урок «Несколько слов
  # про CI». Пуш в main закрыт настройкой репозитория (Settings → Branches →
  # Branch protection rules), поэтому отдельного запуска на push не нужно —
  # всё, что попадает в main, проходит через pull request.
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  # Рабочая версия проекта. Совместимость с 3.10 и 3.11 проверяется отдельной
  # матрицей — см. задачу tests-matrix ниже.
  DEFAULT_PYTHON: "3.12"

jobs:
  lint:
    name: Линтеры (${{ matrix.part }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Конфигурации линтеров лежат по одной на часть репозитория: у каждого
        # сервиса свои pyproject.toml и setup.cfg, и запускать линтер из корня
        # нельзя — он возьмёт чужие настройки.
        part: [".", "auth", "admin_panel", "etl", "ugc", "ugc_etl", "ugc_content", "notifications", "research", "booking", "web"]
    steps:
      - uses: actions/checkout@v4

      - name: Поставить Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.DEFAULT_PYTHON }}
          cache: pip

      - name: Поставить линтеры
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.14.0 flake8==7.3.0 flake8-docstrings==1.7.0

      - name: ruff
        working-directory: ${{ matrix.part }}
        run: ruff check .

      - name: flake8
        working-directory: ${{ matrix.part }}
        run: flake8 .

  style:
    name: Отчёт о стиле HTML-файлом
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Поставить Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.DEFAULT_PYTHON }}
          cache: pip

      - name: Поставить линтеры и генератор отчёта
        run: |
          python -m pip install --upgrade pip
          pip install flake8==7.3.0 flake8-docstrings==1.7.0 flake8-html==0.4.3 \
                      wemake-python-styleguide==1.4.0

      - name: Отчёт по частям репозитория
        # Отчёт нужен как артефакт, а не как приговор: `|| true` не прячет
        # ошибки — сами линтеры гоняются задачей lint выше и валят сборку там.
        # Здесь собирается читаемый HTML, по которому видно всю картину сразу.
        run: |
          for part in . auth admin_panel etl ugc ugc_etl ugc_content notifications research booking web; do
            (cd "$part" && flake8 . --format=html --htmldir="$GITHUB_WORKSPACE/lint-report/$part") || true
          done

      - name: Отчёт wemake-python-styleguide по новому сервису
        # wemake — самый строгий из распространённых наборов правил, и
        # включать его как обязательный на код четырёх спринтов значит
        # переписать проект ради линтера. Поэтому он советчик: отчёт есть,
        # сборку не валит. Обязательные правила проекта проверяют ruff и
        # flake8 в задаче lint.
        continue-on-error: true
        working-directory: notifications
        run: |
          flake8 --select=WPS src --format=html \
                 --htmldir="$GITHUB_WORKSPACE/lint-report/wemake-notifications" || true

      - name: Сохранить отчёт
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: lint-report
          if-no-files-found: warn

  types:
    name: Типы (${{ matrix.part }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Админки здесь нет: Django без django-stubs проверяется бессмысленно —
        # mypy не знает ни про модели, ни про менеджеры и выдаёт ошибки на
        # ровном месте. Это отдельная задача, а не повод ослабить проверку
        # остальным.
        part: [".", "auth", "ugc", "ugc_etl", "ugc_content", "notifications", "booking", "web"]
    steps:
      - uses: actions/checkout@v4

      - name: Поставить Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.DEFAULT_PYTHON }}
          cache: pip

      - name: Поставить mypy и зависимости сервиса
        working-directory: ${{ matrix.part }}
        run: |
          python -m pip install --upgrade pip
          pip install mypy==2.3.1
          pip install -r requirements.txt

      - name: mypy
        working-directory: ${{ matrix.part }}
        # --ignore-missing-imports: у части библиотек нет типов, и требовать
        # их заглушки от нас — не та работа, ради которой ставилась проверка.
        run: mypy src --ignore-missing-imports

  tests-matrix:
    name: ${{ matrix.part }} на Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Урок называет Python 3.8 и 3.9. Обе версии сняты с поддержки
        # (3.8 — в октябре 2024, 3.9 — в октябре 2025), и код проекта на них
        # не запустится: `X | None` в аннотациях появился в 3.10. Поэтому
        # матрица начинается с 3.10 — самой старой версии, которая ещё
        # поддерживается. Смысл требования — «проверьте на нескольких
        # версиях» — выполняется.
        python-version: ["3.10", "3.11", "3.12"]
        part: ["ugc_content", "notifications"]
    steps:
      - uses: actions/checkout@v4

      - name: Поставить Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Поставить зависимости
        working-directory: ${{ matrix.part }}
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/unit/requirements.txt

      - name: Unit-тесты
        working-directory: ${{ matrix.part }}/tests/unit
        run: python -m pytest

      - name: Проверить типы под эту версию Python
        working-directory: ${{ matrix.part }}
        # mypy знает, какие возможности стандартной библиотеки появились в
        # какой версии: так видно, что сервис не использует ничего новее 3.10.
        run: |
          pip install mypy==2.3.1
          mypy src --ignore-missing-imports --python-version=${{ matrix.python-version }}

  tests:
    name: Unit-тесты (${{ matrix.part }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Эти части написаны под 3.12 и используют её возможности
        # (дженерики в синтаксисе PEP 695, StrEnum, datetime.UTC), поэтому у
        # них одна версия. Матрица версий — у сервиса контента выше: он
        # написан совместимым с 3.10 намеренно.
        part: [".", "auth", "ugc", "ugc_etl", "admin_panel", "notifications", "booking", "web"]
    steps:
      - uses: actions/checkout@v4

      - name: Поставить Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.DEFAULT_PYTHON }}
          cache: pip

      - name: Поставить зависимости
        working-directory: ${{ matrix.part }}
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/unit/requirements.txt

      - name: Unit-тесты
        working-directory: ${{ matrix.part }}/tests/unit
        run: python -m pytest

  # Секреты для уведомления задаются в Settings → Secrets and variables →
  # Actions:
  #   TELEGRAM_BOT_TOKEN — выдаёт @BotFather при создании бота;
  #   TELEGRAM_CHAT_ID   — идентификатор получателя. Напишите боту любое
  #     сообщение (для группы — добавьте его туда и напишите в неё), затем:
  #       curl -s "https://api.telegram.org/bot<TOKEN>/getUpdates" \
  #         | python3 -c 'import sys,json; print(json.load(sys.stdin)["result"][-1]["message"]["chat"])'
  #     В личной переписке идентификатор положительный, у группы —
  #     отрицательный (у супергруппы начинается с -100).
  etl-tests:
    name: Тесты ETL каталога
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Поставить Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.DEFAULT_PYTHON }}
          cache: pip

      - name: Поставить зависимости
        working-directory: etl
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Тесты
        working-directory: etl
        # У этого ETL тесты лежат в tests/, а не в tests/unit: он перенесён из
        # первого модуля как есть, и его раскладку не переделывали.
        run: python -m pytest tests

  # Функциональные тесты сервиса бронирования: настоящие PostgreSQL и сервис
  # авторизации в docker compose. Гарантия «не больше мест, чем есть» держится
  # на базе, поэтому без настоящей базы её не проверить — unit-тестов мало.
  booking-functional:
    name: Функциональные тесты бронирования
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Тесты в изолированном окружении
        run: |
          docker compose -f booking/tests/functional/docker-compose.yml up --build \
            --abort-on-container-exit --exit-code-from tests

      - name: Убрать окружение
        if: always()
        run: docker compose -f booking/tests/functional/docker-compose.yml down -v

  notify:
    name: Уведомление в Telegram
    runs-on: ubuntu-latest
    # needs — ключевое слово уровня job, а не step. `if: always()` нужен,
    # чтобы уведомление уходило и при падении: урок требует сообщать и об
    # успехе, и об ошибке с названием упавшего шага.
    needs: [lint, style, types, tests-matrix, tests, etl-tests, booking-functional]
    if: always()
    env:
      # Секреты нельзя прочитать в `if` напрямую — контекст secrets там
      # недоступен. Поэтому кладём их в переменные окружения задачи: их `if`
      # уже видит.
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - name: Собрать текст сообщения
        id: message
        env:
          # Результаты всех задач одной строкой JSON: по ним видно, какие
          # именно упали.
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYTHON' >> "$GITHUB_OUTPUT"
          import json, os

          results = json.loads(os.environ['RESULTS'])
          failed = [name for name, job in results.items() if job['result'] not in ('success', 'skipped')]
          project = os.environ['GITHUB_REPOSITORY'].split('/')[-1]
          commit = os.environ['GITHUB_SHA'][:8]
          outcome = 'with error' if failed else 'successfully'
          lines = [f'{project}: Pipeline for {commit} finished {outcome}!']
          lines += [f'{name} failed' for name in failed]
          print('status=' + ('failure' if failed else 'success'))
          print('text<<EOF')
          print('\n'.join(lines))
          print('EOF')
          PYTHON

      - name: Отправить сообщение
        if: env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != ''
        uses: appleboy/telegram-action@v1.0.1
        with:
          to: ${{ env.TELEGRAM_CHAT_ID }}
          token: ${{ env.TELEGRAM_BOT_TOKEN }}
          # Формат из урока «Несколько слов про CI»: имя репозитория, хеш
          # коммита, итог и названия упавших шагов. Ветка и ссылка на сборку —
          # сверх формата: без них по сообщению непонятно, куда идти смотреть.
          message: |
            ${{ steps.message.outputs.status == 'success' && '✅' || '❌' }} ${{ steps.message.outputs.text }}
            Ветка: ${{ github.head_ref || github.ref_name }}
            Автор: ${{ github.actor }}
            Сборка: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Сообщить, что секреты не заданы
        if: env.TELEGRAM_BOT_TOKEN == '' || env.TELEGRAM_CHAT_ID == ''
        # Не ошибка: в форке и в свежем клоне секретов нет, и валить из-за
        # этого сборку неправильно. Но и молчать нельзя — иначе «уведомление
        # не пришло» выясняется много позже.
        run: |
          echo '::warning::Уведомление не отправлено: задайте секреты' \
               'TELEGRAM_BOT_TOKEN и TELEGRAM_CHAT_ID в Settings →' \
               'Secrets and variables → Actions'

      - name: Провалить сборку, если упала любая проверка
        # `if: always()` выше означает, что эта задача завершилась бы успехом
        # даже при падении соседних. Без этого шага общий статус сборки был бы
        # зелёным при красных проверках.
        if: steps.message.outputs.status != 'success'
        run: exit 1
