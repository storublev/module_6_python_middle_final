# Изолированное окружение функциональных тестов: API, Elasticsearch, Redis и
# контейнер с тестами. Данные тесты создают сами, ETL и PostgreSQL не нужны.
#
#   docker compose -f tests/functional/docker-compose.yml up --build \
#       --abort-on-container-exit --exit-code-from tests
#
# Порты API, Elasticsearch и Redis проброшены на localhost, чтобы запускать
# тесты и сервис локально, из IDE, с отладчиком.
name: movies-api-functional-tests

services:
  elasticsearch:
    image: elasticsearch:8.5.3
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "${TEST_ELASTIC_PORT:-9200}:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 30

  redis:
    image: redis:7.4-alpine
    command: redis-server --save "" --appendonly no
    ports:
      - "${TEST_REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 20

  api:
    # Тестируется тот же образ, что уходит в работу: Dockerfile из корня проекта.
    build: ../..
    image: movies-api
    environment:
      ELASTIC_HOST: elasticsearch
      ELASTIC_PORT: 9200
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_EXPIRE_IN_SECONDS: 300
      WEB_CONCURRENCY: 2
    ports:
      - "${TEST_API_PORT:-8000}:8000"
    depends_on:
      elasticsearch:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/openapi.json')"]
      interval: 2s
      timeout: 5s
      retries: 30

  tests:
    build:
      context: ../..
      dockerfile: tests/functional/Dockerfile
    environment:
      ELASTIC_URL: http://elasticsearch:9200
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SERVICE_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
