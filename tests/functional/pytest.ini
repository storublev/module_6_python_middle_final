[pytest]
testpaths = src
addopts = -ra --strict-markers
# Клиенты Elasticsearch, Redis и HTTP создаются один раз на сессию, поэтому
# фикстуры и тесты работают в одном цикле событий на всю сессию.
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
