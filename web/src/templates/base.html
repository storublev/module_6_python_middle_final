<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Practix{% endblock %} — Practix</title>
  <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
</head>
<body>
  <header class="topbar">
    <div class="topbar__inner">
      <a class="logo" href="/">Practix</a>
      <form class="search" action="/" method="get" role="search">
        <input type="search" name="q" value="{{ q or '' }}" placeholder="Найти фильм" aria-label="Найти фильм">
      </form>
      <nav class="nav">
        <a href="/">Фильмы</a>
        <a href="/afisha">Афиша показов</a>
        {% if viewer %}
          <a href="/me/bookings">Мои брони</a>
          <a href="/me/screenings">Моё расписание</a>
          <form action="/logout" method="post" class="nav__logout">
            <span class="nav__name">{{ viewer.name }}</span>
            <button type="submit" class="link">Выйти</button>
          </form>
        {% else %}
          <a href="/login" class="btn btn--small">Войти</a>
        {% endif %}
      </nav>
    </div>
  </header>
  <main class="page">
    {% if notice %}<div class="flash flash--ok" role="status">{{ notice }}</div>{% endif %}
    {% if error %}<div class="flash flash--error" role="alert">{{ error }}</div>{% endif %}
    {% block content %}{% endblock %}
  </main>
  <footer class="footer">Practix · онлайн-кинотеатр · смотрите вместе</footer>
</body>
</html>
