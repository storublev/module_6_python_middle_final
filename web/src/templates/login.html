{% extends 'base.html' %}
{% block title %}Вход{% endblock %}
{% block content %}
  <section class="auth">
    <h1>Вход</h1>
    <form method="post" action="/login" class="form">
      <input type="hidden" name="next_url" value="{{ next_url }}">
      <label>Логин <input type="text" name="login" required autocomplete="username" maxlength="150"></label>
      <label>Пароль <input type="password" name="password" required autocomplete="current-password" maxlength="128"></label>
      <button class="btn" type="submit">Войти</button>
    </form>
    <p class="muted">Нет аккаунта? <a href="/register">Зарегистрируйтесь</a></p>
  </section>
{% endblock %}
