worker_processes auto;
# Лимит файловых дескрипторов на воркер должен покрывать и клиентские
# соединения, и соединения с upstream.
worker_rlimit_nofile 20480;

events {
    worker_connections 10240;
    multi_accept on;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # request_id в журнале — та же строка, что уходит сервисам заголовком
    # X-Request-Id и попадает в спаны: по ней запрос ищется в Jaeger.
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time urt=$upstream_response_time '
                    'rid=$request_id';
    access_log /var/log/nginx/access.log main;

    # Тот же журнал, но в JSON и в отдельный файл: его читает filebeat и везёт
    # в ELK. Разбирать строки grok-выражениями на стороне Logstash — лишняя
    # работа и лишний источник ошибок, а JSON приезжает уже полями.
    log_format json escape=json '{'
        '"@timestamp":"$time_iso8601",'
        '"service":"nginx",'
        '"remote_addr":"$remote_addr",'
        '"request":"$request",'
        '"status":$status,'
        '"bytes":$body_bytes_sent,'
        '"referer":"$http_referer",'
        '"user_agent":"$http_user_agent",'
        '"request_time":$request_time,'
        '"upstream_time":"$upstream_response_time",'
        '"request_id":"$request_id"'
    '}';
    access_log /var/log/nginx/access.json json;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    server_tokens   off;

    gzip            on;
    gzip_min_length 1000;
    gzip_types      application/json;

    include conf.d/*.conf;
}
