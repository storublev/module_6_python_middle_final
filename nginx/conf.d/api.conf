upstream api {
    server api:8000;
    # Пул постоянных соединений с API: не тратим время на TCP-рукопожатие
    # на каждый запрос.
    keepalive 64;
}

upstream auth {
    server auth:8000;
    keepalive 32;
}

upstream admin {
    server django-admin:8000;
    keepalive 16;
}

# Первый рубеж для входа и регистрации: поток запросов с одного адреса
# отсекается, не доходя до сервиса. Точные лимиты по IP и логину за
# скользящее окно считает сам сервис в Redis.
limit_req_zone $binary_remote_addr zone=auth_credentials:10m rate=5r/s;

server {
    listen      80 default_server;
    server_name _;

    location /api/ {
        proxy_pass         http://api;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /auth/ {
        include conf.d/auth_proxy.inc;
    }

    location ~ ^/auth/api/v1/(login|signup)$ {
        # Всплеск до 10 запросов проходит без задержки, дальше — 5 в секунду.
        limit_req        zone=auth_credentials burst=10 nodelay;
        limit_req_status 429;
        error_page       429 = @auth_too_many_requests;
        include conf.d/auth_proxy.inc;
    }

    # Ответ в формате ошибок сервиса авторизации, а не HTML-страница nginx.
    location @auth_too_many_requests {
        default_type application/json;
        add_header   Retry-After 1 always;
        return 429 '{"code": "too_many_requests", "detail": "Too many requests, retry later"}';
    }

    # Статика админки: её выложил в общий том одноразовый контейнер миграций.
    location /static/ {
        alias      /usr/share/nginx/html/static/;
        expires    30d;
        add_header Cache-Control "public";
    }

    location /admin/ {
        proxy_pass         http://admin;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        # Django сверяет Host и Origin с ALLOWED_HOSTS и CSRF_TRUSTED_ORIGINS,
        # поэтому передаём адрес, который набрал пользователь.
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Вход сотрудника ждёт ответа сервиса авторизации: его собственный
        # таймаут короче, но nginx не должен оборвать запрос раньше.
        proxy_read_timeout 30s;
    }

    location / {
        return 404;
    }
}
