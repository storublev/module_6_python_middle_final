# Адреса сервисов разрешаются на каждый запрос, а не один раз при старте.
#
# Имена в блоке upstream nginx резолвит при загрузке конфигурации и держит
# полученный IP до перезапуска. Пересоздали контейнер — он получил новый адрес,
# а nginx продолжает слать запросы на старый. Хуже того, Docker переиспользует
# освободившиеся адреса: старый адрес сервиса авторизации может достаться
# админке, и запросы аутентификации молча уйдут не туда.
#
# Поэтому адрес каждого сервиса лежит в переменной: с переменной в proxy_pass
# nginx обращается к DNS Docker (127.0.0.11) при каждом запросе и подхватывает
# новый адрес за valid=10s. Платим за это пулом постоянных соединений — с
# переменной блок upstream не используется, и соединение открывается на
# запрос. Для нагрузки кинотеатра это дешевле, чем разбираться, почему часть
# запросов уходит в чужой сервис после перезапуска контейнера.
resolver 127.0.0.11 valid=10s ipv6=off;

# Первый рубеж для запросов, проверяющих пароль (вход, регистрация и
# подтверждение пароля в личном кабинете): поток запросов с одного адреса
# отсекается, не доходя до сервиса. Точные лимиты по IP, логину и учётной
# записи за скользящее окно считает сам сервис в Redis.
limit_req_zone $binary_remote_addr zone=auth_credentials:10m rate=5r/s;

# Короткие ссылки из писем. Переход по ссылке — обычное чтение, но именно по
# этим адресам ходят сканеры почтовых сервисов и боты, проверяющие ссылки в
# письмах. Предел отсекает перебор ключей, не мешая живым переходам.
limit_req_zone $binary_remote_addr zone=short_links:10m rate=20r/s;

# Кеш обложек: картинки лежат в базе каталога и отдаются админкой, а
# показываются на каждой странице каталога. С кешем Django спрашивают один раз
# на картинку в сутки, остальное nginx отдаёт с диска.
proxy_cache_path /var/cache/nginx/posters levels=1:2 keys_zone=posters:10m max_size=512m inactive=7d
                 use_temp_path=off;

# Запись в сервис бронирования: показы, брони, отмены, оценки. Человек не
# бронирует десять раз в секунду, а скрипт, скупающий места или меняющий бронь
# по кругу (каждое изменение — запись в базу и письмо), — бронирует.
# Запись узнаётся по методу, а не по списку адресов: новый эндпоинт записи
# попадёт под предел сам, а не тогда, когда о нём вспомнят в регулярном
# выражении. Чтение (GET, HEAD, OPTIONS) не ограничивается — пустой ключ
# limit_req не считает. Сменился ключ зоны — nginx нужно перезапустить, а не
# перезагрузить: `nginx -s reload` с другим ключом той же зоны отказывает, и
# продолжают работать процессы со старыми правилами.
map $request_method $booking_write_key {
    GET     "";
    HEAD    "";
    OPTIONS "";
    default $binary_remote_addr;
}
limit_req_zone $booking_write_key zone=booking_writes:10m rate=5r/s;

# Интерфейс: зритель листает каталог быстро, но не быстрее нескольких страниц
# в секунду. Предел отсекает перебор и сканеры, не мешая людям.
map $request_method $web_form_key {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone $web_form_key zone=web_forms:10m rate=5r/s;

server {
    listen      80 default_server;
    server_name _;

    location /api/ {
        set $api http://api:8000;
        proxy_pass         $api;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Request-Id $request_id;
    }

    location /auth/ {
        include conf.d/auth_proxy.inc;
    }

    location ~ ^/auth/api/v1/(login|signup)$ {
        # Всплеск до 10 запросов проходит без задержки, дальше — 5 в секунду.
        limit_req        zone=auth_credentials burst=10 nodelay;
        limit_req_status 429;
        error_page       429 = @auth_too_many_requests;
        include conf.d/auth_proxy.inc;
    }

    # Смена логина и пароля тоже сверяет пароль, поэтому идёт через тот же рубеж.
    location ~ ^/auth/api/v1/users/me/(login|password)$ {
        limit_req        zone=auth_credentials burst=10 nodelay;
        limit_req_status 429;
        error_page       429 = @auth_too_many_requests;
        include conf.d/auth_proxy.inc;
    }

    # Ответ в формате ошибок сервиса авторизации, а не HTML-страница nginx.
    location @auth_too_many_requests {
        default_type application/json;
        add_header   Retry-After 1 always;
        return 429 '{"code": "too_many_requests", "detail": "Too many requests, retry later"}';
    }

    # Сервис уведомлений: приём событий от других сервисов, шаблоны и рассылки
    # для админки, личный кабинет зрителя, отписка и подтверждение адреса.
    location /notify/ {
        include conf.d/notify_proxy.inc;
    }

    # Короткие ссылки из писем живут в корне: в письме они должны быть
    # короткими, ради этого сервис сокращения и делался.
    location /s/ {
        limit_req        zone=short_links burst=40 nodelay;
        limit_req_status 429;
        include conf.d/notify_proxy.inc;
    }

    # Websocket-шлюз мгновенных уведомлений. Соединение долгоживущее, поэтому
    # ему нужны заголовки апгрейда и большой таймаут чтения: обычные 60 секунд
    # закрывали бы соединение каждую минуту.
    location /ws/ {
        set $notify_ws http://notify-ws:8000;
        proxy_pass         $notify_ws;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Request-Id $request_id;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Статика админки: её выложил в общий том одноразовый контейнер миграций.
    location /static/ {
        alias      /usr/share/nginx/html/static/;
        expires    30d;
        add_header Cache-Control "public";
    }

    location /admin/ {
        set $admin http://django-admin:8000;
        proxy_pass         $admin;
        # Django сверяет Host и Origin с ALLOWED_HOSTS и CSRF_TRUSTED_ORIGINS,
        # поэтому передаём адрес, который набрал пользователь.
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Request-Id $request_id;
        # Вход сотрудника ждёт ответа сервиса авторизации: его собственный
        # таймаут короче, но nginx не должен оборвать запрос раньше.
        proxy_read_timeout 30s;
    }

    # Сервис бронирования: публичный API показов, броней и оценок. Любая
    # запись (POST, PATCH и т.д.) ограничена по частоте, чтение — нет.
    location /booking/ {
        limit_req        zone=booking_writes burst=20 nodelay;
        limit_req_status 429;
        error_page       429 = @booking_too_many_requests;
        include conf.d/booking_proxy.inc;
    }

    location @booking_too_many_requests {
        default_type application/json;
        add_header   Retry-After 1 always;
        return 429 '{"code": "too_many_requests", "detail": "Too many requests, retry later"}';
    }

    # Обложки фильмов из базы каталога (ADR-25): отдаёт админка, кеширует nginx.
    location /posters/ {
        set $admin http://django-admin:8000;
        proxy_pass         $admin;
        proxy_set_header   Host $host;
        proxy_set_header   X-Request-Id $request_id;
        proxy_cache        posters;
        proxy_cache_valid  200 1d;
        proxy_cache_valid  404 1m;
        # Cookie зрителя картинке не нужна, а с ней nginx не стал бы кешировать.
        proxy_set_header   Cookie "";
        proxy_ignore_headers Set-Cookie Vary;
        add_header         X-Cache-Status $upstream_cache_status always;
    }

    # Всё остальное — интерфейс кинотеатра: каталог, карточки фильмов,
    # бронирование и кабинет. Формы интерфейса меняют брони, поэтому POST на
    # него ограничен тем же пределом, что и запись в API бронирования.
    location / {
        set $web http://web:8000;
        proxy_pass         $web;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Request-Id $request_id;
        limit_req          zone=web_forms burst=20 nodelay;
        limit_req_status   429;
    }
}
