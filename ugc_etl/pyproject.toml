[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N", "S", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# В тестах assert — основной инструмент, а пароли и ключи — заглушки.
"tests/**" = ["S101", "S105", "S106", "S107"]

[tool.ruff.lint.isort]
# Модули сервиса импортируются от src, как при запуске.
known-first-party = ["core", "main", "models", "services", "storage", "tests"]
