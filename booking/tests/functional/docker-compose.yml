# Изолированное окружение функциональных тестов сервиса бронирования.
#
#   docker compose -f booking/tests/functional/docker-compose.yml up --build \
#       --abort-on-container-exit --exit-code-from tests
#
# База и сервис авторизации — настоящие: гарантия «не больше мест, чем есть»
# держится на PostgreSQL, и проверять её на чём-то другом бессмысленно, а
# имена хоста и гостя приходят из справочника сервиса авторизации. Каталог и
# сервис уведомлений заменены заглушкой (stub.py) с их точным контрактом.
#
# Порты проброшены на localhost, чтобы запускать тесты локально, из IDE.
name: booking-functional-tests

x-booking-env: &booking-env
  BOOKING_POSTGRES_HOST: booking-postgres
  BOOKING_POSTGRES_DB: booking
  BOOKING_POSTGRES_USER: booking
  BOOKING_POSTGRES_PASSWORD: functional-tests
  BOOKING_CATALOG_URL: http://stub:8000
  BOOKING_AUTH_URL: http://auth:8000
  BOOKING_NOTIFY_URL: http://stub:8000
  # Показ можно назначить через 2 секунды, а не через 30 минут: тестам оценок
  # нужно дождаться начала показа, а ждать полчаса незачем.
  BOOKING_MIN_LEAD_TIME: 2
  BOOKING_OUTBOX_POLL_INTERVAL: 0.2
  BOOKING_RETRY_DELAY: 1
  # Идентификатор запроса ставит nginx, а здесь его нет.
  BOOKING_REQUIRE_REQUEST_ID: "false"
  AUTH_JWT_SECRET_KEY: functional-tests-secret-key-of-32-bytes
  AUTH_SERVICE_TOKEN: functional-tests-service-token

x-auth-env: &auth-env
  AUTH_POSTGRES_HOST: auth-postgres
  AUTH_POSTGRES_DB: auth
  AUTH_POSTGRES_USER: auth
  AUTH_POSTGRES_PASSWORD: functional-tests
  AUTH_REDIS_HOST: auth-redis
  AUTH_JWT_SECRET_KEY: functional-tests-secret-key-of-32-bytes
  AUTH_SERVICE_TOKEN: functional-tests-service-token
  AUTH_REQUIRE_REQUEST_ID: "false"
  # Все тесты приходят с одного адреса: штатные пределы регистраций и входов
  # сработали бы на десятке зрителей. Сами пределы проверяет сервис авторизации.
  AUTH_SIGNUP_ATTEMPTS_PER_IP: "10000"
  AUTH_LOGIN_ATTEMPTS_PER_IP: "10000"
  AUTH_PASSWORD_CHECK_ATTEMPTS_PER_IP: "10000"

services:
  booking-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: booking
      POSTGRES_USER: booking
      POSTGRES_PASSWORD: functional-tests
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booking"]
      interval: 2s
      timeout: 5s
      retries: 30

  auth-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: auth
      POSTGRES_USER: auth
      POSTGRES_PASSWORD: functional-tests
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth"]
      interval: 2s
      timeout: 5s
      retries: 30

  auth-redis:
    image: redis:7.4-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30

  auth:
    build: ../../../auth
    image: movies-auth
    environment: *auth-env
    # Миграции — в команде запуска: одноразовый контейнер миграций остановил
    # бы всё окружение через --abort-on-container-exit.
    command: >
      sh -c "alembic upgrade head &&
             uvicorn main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips '*'"
    ports:
      - "${TEST_AUTH_PORT:-8008}:8000"
    depends_on:
      auth-postgres:
        condition: service_healthy
      auth-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/auth/api/openapi.json')"]
      interval: 2s
      timeout: 5s
      retries: 40

  stub:
    image: python:3.12-slim
    command: ["python", "/stub/stub.py"]
    volumes:
      - ./stub.py:/stub/stub.py:ro
    ports:
      - "${TEST_STUB_PORT:-8009}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/_events')"]
      interval: 2s
      timeout: 5s
      retries: 30

  booking-api:
    # Тестируется тот же образ, что уходит в работу.
    build: ../..
    image: movies-booking
    environment: *booking-env
    command: >
      sh -c "alembic upgrade head &&
             uvicorn main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips '*'"
    ports:
      - "${TEST_BOOKING_PORT:-8007}:8000"
    depends_on:
      booking-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/booking/api/v1/health')"]
      interval: 2s
      timeout: 5s
      retries: 40

  booking-relay:
    build: ../..
    image: movies-booking
    environment: *booking-env
    command: ["python", "relay.py"]
    depends_on:
      booking-api:
        condition: service_healthy

  tests:
    build:
      context: ../..
      dockerfile: tests/functional/Dockerfile
    environment:
      SERVICE_URL: http://booking-api:8000
      AUTH_URL: http://auth:8000
      STUB_URL: http://stub:8000
    depends_on:
      booking-api:
        condition: service_healthy
      auth:
        condition: service_healthy
      stub:
        condition: service_healthy
