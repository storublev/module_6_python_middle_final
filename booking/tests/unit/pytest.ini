[pytest]
addopts = -ra --strict-markers
# Модули сервиса импортируются так же, как при запуске из src, а пакет tests — от корня booking.
pythonpath = ../../src ../..
# Асинхронные тесты бизнес-логики не требуют отдельной пометки: хранилища в
# памяти тоже асинхронные, и писать @pytest.mark.asyncio у каждого — шум.
asyncio_mode = auto
# Предупреждения starlette об устаревших anyio и httpx — не наш код.
filterwarnings =
    ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning
    ignore:Using `httpx` with `starlette.testclient` is deprecated
