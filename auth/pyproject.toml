[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N", "S", "ASYNC"]
ignore = [
    # FastAPI объявляет зависимости через Depends в значениях по умолчанию.
    "B008",
]

[tool.ruff.lint.per-file-ignores]
# В тестах assert — основной инструмент, а пароли и ключи — заглушки.
# Имена таблиц и секций в тестах — собственные константы, не ввод снаружи.
"tests/**" = ["S101", "S105", "S106", "S608"]
# Миграции собирают DDL из собственных констант: имена таблиц и схем снаружи
# не приходят, и параметры в DDL PostgreSQL не принимает.
"migrations/**" = ["S608"]

[tool.ruff.lint.isort]
# Модули сервиса импортируются от src, как при запуске.
known-first-party = ["api", "cli", "core", "db", "main", "models", "services", "storage", "tests"]
