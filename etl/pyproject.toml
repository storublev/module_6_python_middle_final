[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# Набор правил уже, чем у остальных частей репозитория, и это намеренно.
# ETL каталога — код первого модуля, перенесённый сюда как есть: у него свой
# стиль (двойные кавычки, свой порядок импортов, docstring'и другого формата).
# Переписывать его под общий стиль означало бы переписать рабочий сервис ради
# косметики, поэтому линтер здесь ищет только то, что говорит об ошибках:
# неопределённые имена, неиспользуемые переменные, опасные конструкции.
select = ["E", "W", "F", "B", "S"]
ignore = [
    # Пустой except в повторах подключения — осознанный: ETL переживает
    # недоступность PostgreSQL и Elasticsearch и пробует снова.
    "S110",
]

[tool.ruff.lint.per-file-ignores]
# В тестах assert — основной инструмент.
"tests/**" = ["S101"]
