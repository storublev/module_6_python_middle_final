[pytest]
addopts = -ra --strict-markers
# Модули сервиса импортируются так же, как при запуске из src, а пакет tests — от корня notifications.
pythonpath = ../../src ../..
# Асинхронные тесты бизнес-логики не требуют отдельной пометки: хранилища в
# памяти тоже асинхронные, и писать @pytest.mark.asyncio у каждого — шум.
asyncio_mode = auto
