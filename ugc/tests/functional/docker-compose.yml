# Изолированное окружение функциональных тестов сервиса сбора событий:
# Kafka, сам сервис и контейнер с тестами.
#
#   docker compose -f ugc/tests/functional/docker-compose.yml up --build \
#       --abort-on-container-exit --exit-code-from tests
#
# Порты сервиса и брокера проброшены на localhost, чтобы запускать тесты
# локально, из IDE, с отладчиком.
name: ugc-functional-tests

services:
  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # Два слушателя: внутренний для контейнеров и внешний для тестов,
      # запущенных на хосте. Объявленный адрес у них разный — контейнеры
      # ходят по имени kafka, хост по localhost.
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Топик заводит сам брокер: отдельный контейнер с kafka-topics.sh
      # остановил бы всё окружение по --abort-on-container-exit.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 4
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    ports:
      # Порт фиксированный: он же объявлен брокером в EXTERNAL-слушателе,
      # и менять одно без другого нельзя.
      - "29092:29092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 30

  ugc:
    # Тестируется тот же образ, что уходит в работу.
    build: ../..
    image: movies-ugc
    environment:
      UGC_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      UGC_KAFKA_TOPIC: ugc.events
      # Небольшой предел пачки, чтобы тест упирался в него за несколько событий.
      UGC_MAX_EVENTS_PER_REQUEST: 5
      # Ключ только для тестов: тесты подписывают им и обычные, и истёкшие токены.
      AUTH_JWT_SECRET_KEY: functional-tests-secret-key-of-32-bytes
      WEB_CONCURRENCY: 2
    ports:
      - "${TEST_UGC_PORT:-8002}:8000"
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ugc/api/v1/ready')"]
      interval: 2s
      timeout: 5s
      retries: 30

  tests:
    build:
      context: ../..
      dockerfile: tests/functional/Dockerfile
    environment:
      SERVICE_URL: http://ugc:8000
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: ugc.events
      JWT_SECRET_KEY: functional-tests-secret-key-of-32-bytes
      MAX_EVENTS_PER_REQUEST: 5
    depends_on:
      ugc:
        condition: service_healthy
